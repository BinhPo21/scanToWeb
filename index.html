<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Quét QR Tờ Lệnh 3/2</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<!-- Version: V57-F - Man quet QR co dinh, khong scroll -->
<link rel="stylesheet" href="style.css">
</head>
<body class="home-mode">

<div id="manualPopupOverlay" class="manual-popup-overlay hidden" aria-hidden="true">
    <div id="manualPopup" class="manual-popup" role="dialog" aria-modal="true" aria-labelledby="manualPopupTitle">
        <div id="manualPopupTitle" class="manual-popup-title">Nhập Mã Lệnh hoặc Chuỗi QR</div>
        <div class="manual-popup-row">
            <input id="manualPopupInput" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Nhập Mã Lệnh hoặc Chuỗi QR">
            <button id="manualPopupSubmit" type="button" aria-label="OK">OK</button>
        </div>
    </div>
</div>

<div id="warningModal" class="modal-overlay hidden">
<div class="modal-box">
<div id="warningTitle" class="modal-title">⚠️ Cảnh báo</div>
<div id="warningMessage" class="modal-message"></div>
<button id="warningOk" class="modal-ok" type="button">Ok</button>
</div>
</div>
<main class="wrap"><section class="card home-mode">
<div id="appHeader" class="app-header"><h1>📷 Quét QR Tờ Lệnh 3/2</h1><p class="sub">Chọn bộ phận → Quét QR → tự điền Google Form</p><div id="departmentBar" class="department-bar hidden"><div id="selectedDepartment" class="selected-department"></div><button id="changeDepartment" class="change-department" type="button">🔄 Bộ Phận</button></div></div>
<div id="departmentScreen"><div class="department-title">Chọn bộ phận</div><div class="department-grid"><button class="department-button" data-department="In">🖨️ IN</button><button class="department-button" data-department="Bế">✂️ BẾ</button><button class="department-button" data-department="Thành Phẩm">📦 THÀNH PHẨM</button><button class="department-button" data-department="Kho">🏭 KHO</button><button class="department-button" data-department="Thanh V">📝 THANH V</button><button class="department-button" data-department="Giấy Tổ Ong">🐝 GIẤY TỔ ONG</button></div></div>
<div id="scannerScreen" class="hidden"><div class="camera" id="cameraBox"><video id="video" playsinline muted></video><div class="scan-box"></div></div><div class="camera-controls"><button id="flashButton" class="flash-button" type="button" style="display:none;">🔦 BẬT FLASH</button></div><div id="status" class="status">Đang tải bộ quét QR...</div><div id="imageScanBox"><input id="imageInput" type="file" accept="image/*"><label id="imagePicker" for="imageInput">🖼️ Chọn Ảnh Quét QR</label></div><div class="manual" id="manualBox">
<label class="manual-label" for="manualCode">Nhập Mã Lệnh hoặc Chuỗi QR</label>
<input id="manualCode" type="text" autocomplete="off" readonly aria-label="Nhập Mã Lệnh hoặc Chuỗi QR" placeholder="Nhập Mã Lệnh hoặc Chuỗi QR">
<div class="manual-buttons">
<button id="pasteButton" type="button">📋 Dán</button>
<button id="openButton" type="button" disabled>Mở Form</button>
</div>
</div><div class="info">QR 1 mã bỏ qua đối chiếu. QR 5/6 mã đối chiếu với Google Sheet.<br> Mã Lệnh luôn bỏ qua khi cảnh báo.</div></div>
<div id="formContainer" class="formbox"><iframe id="googleForm" title="Google Form"></iframe><div id="bottomButtons"><button id="btnScanAgain" type="button">🔄 Quét Tờ Lệnh Khác</button><button id="btnHome" type="button">🏠 Bộ Phận</button></div></div>
</section></main>

<script src="google-sheet-API.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
