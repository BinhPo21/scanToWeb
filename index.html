<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>Quét QR Tờ Lệnh @BinhPo21</title>

  <!-- Dung jsDelivr thay cho unpkg de tranh mot so bo chan CDN. -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    .wrap {
      width: min(560px, 100%);
      margin: 0 auto;
      padding: 12px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 3px 14px rgba(0,0,0,.08);
    }
    h1 {
      margin: 0 0 5px;
      font-size: 22px;
      text-align: center;
    }
    .sub {
      margin: 0 0 12px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }
    #reader {
      width: 100%;
      height: 220px;
      overflow: hidden;
      border-radius: 12px;
      background: #111;
      position: relative;
    }
    #reader video {
      width: 100% !important;
      height: 220px !important;
      max-height: 220px !important;
      object-fit: cover !important;
      border-radius: 12px;
    }
    #reader__scan_region {
      min-height: 0 !important;
      height: 220px !important;
    }
    #reader__scan_region img {
      display: none !important;
    }
    .status {
      margin-top: 8px;
      padding: 9px;
      border-radius: 9px;
      background: #f3f4f6;
      font-size: 13px;
      text-align: center;
      word-break: break-word;
    }
    .status.ok {
      background: #ecfdf5;
      color: #065f46;
    }
    .status.error {
      background: #fef2f2;
      color: #991b1b;
    }
    .manual {
      margin-top: 10px;
      border-top: 1px solid #e5e7eb;
      padding-top: 10px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
    }
    input {
      width: 100%;
      min-height: 46px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }
    button {
      width: 100%;
      min-height: 46px;
      margin-top: 8px;
      border: 0;
      border-radius: 9px;
      background: #4f46e5;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
    }
    .info {
      margin-top: 10px;
      font-size: 11px;
      color: #6b7280;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">
      <h1>📷Quét QR Tờ Lệnh @BinhPo21</h1>
      <p class="sub">Quét QR → tự điền Google Form</p>

      <div id="reader"></div>

      <div id="status" class="status">
        Đang khởi động camera...
      </div>

      <div class="manual">
        <label for="manualCode">Nhập mã QR nếu cần</label>
        <input id="manualCode" type="text" autocomplete="off"
               placeholder="Dán chuỗi QR vào đây">
        <button id="openButton" type="button">Mở Google Form</button>
      </div>

      <div class="info">
        QR có 6 giá trị, ngăn cách bằng dấu |.
      </div>
    </section>
  </main>

<script>
(function () {
  "use strict";

  // ============================================================
  // CẤU HÌNH GOOGLE FORM
  // ============================================================

  const FORM_URL =
    "https://docs.google.com/forms/d/e/1FAIpQLSdGFniU6DwdOeNJ5rbvE7cbEVwHiCKQe8skzRx-4ktXtK5hQQ/viewform";

  const ENTRY_IDS = [
    "entry.392564381",   // Khach Hang
    "entry.682796725",   // Don Hang
    "entry.260788272",   // Ma Lenh
    "entry.632173225",   // Quy Cach San Xuat
    "entry.2147420635",  // Mau Sac
    "entry.697190504"    // So Luong Yeu Cau
  ];

  const statusBox = document.getElementById("status");
  const manualInput = document.getElementById("manualCode");
  const openButton = document.getElementById("openButton");

  let daQuet = false;
  let scanner = null;

  function taoLinkForm(chuoiQR) {
    const parts = String(chuoiQR ?? "").trim().split("|");

    if (parts.length !== ENTRY_IDS.length) {
      throw new Error(
        "QR khong dung cau truc: can 6 gia tri, hien co " +
        parts.length + " gia tri."
      );
    }

    // URLSearchParams tu dong ma hoa dau phay, dau cach, tieng Viet...
    const params = new URLSearchParams();
    params.set("usp", "pp_url");

    for (let i = 0; i < ENTRY_IDS.length; i++) {
      params.set(ENTRY_IDS[i], parts[i].trim());
    }

    return FORM_URL + "?" + params.toString();
  }

  function moGoogleForm(chuoiQR) {
    try {
      const url = taoLinkForm(chuoiQR);

      statusBox.textContent =
        "Da quet du 6 thong tin - dang mo Google Form...";
      statusBox.className = "status ok";

      // Chuyen ngay trong tab hien tai.
      window.location.replace(url);
    } catch (error) {
      statusBox.textContent = error.message;
      statusBox.className = "status error";
      daQuet = false;
    }
  }

  function xuLyMaQuet(ma) {
    if (daQuet) return;
    daQuet = true;

    if (scanner && scanner.isScanning) {
      scanner.stop().catch(function () {});
    }

    // Chuyen trang ngay sau khi nhan ma.
    window.setTimeout(function () {
      moGoogleForm(ma);
    }, 30);
  }

  openButton.addEventListener("click", function () {
    moGoogleForm(manualInput.value);
  });

  manualInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      moGoogleForm(manualInput.value);
    }
  });

  // ============================================================
  // KHỞI ĐỘNG CAMERA
  // ============================================================

  function baoLoiCamera(message) {
    statusBox.textContent = message;
    statusBox.className = "status error";
  }

  function khoiDongCamera() {
    if (typeof Html5Qrcode === "undefined") {
      baoLoiCamera(
        "Khong tai duoc thu vien quet QR. Hay tai lai trang."
      );
      return;
    }

    if (!window.isSecureContext) {
      baoLoiCamera(
        "Camera can HTTPS. Hay mo bang link GitHub Pages https://..."
      );
      return;
    }

    scanner = new Html5Qrcode("reader", {
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
      useBarCodeDetectorIfSupported: false,
      verbose: false
    });

    // Cấu hình gọn, không ép videoConstraints để tránh xung đột
    // với một số Chrome/Android.
    const config = {
      fps: 10,
      qrbox: function (viewfinderWidth, viewfinderHeight) {
        const size = Math.min(
          viewfinderWidth * 0.78,
          viewfinderHeight * 0.68,
          320
        );

        return {
          width: Math.floor(size),
          height: Math.floor(size)
        };
      },
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
      useBarCodeDetectorIfSupported: false,
      disableFlip: true
    };

    statusBox.textContent = "Đang xin quyền Camera...";

    scanner.start(
      { facingMode: "environment" },
      config,
      function (decodedText) {
        xuLyMaQuet(decodedText);
      },
      function () {
        // Bo qua loi cua tung khung hinh.
      }
    ).then(function () {
      statusBox.textContent =
        "Sẵn sàn để quét!";
      statusBox.className = "status";
    }).catch(function (error) {
      console.error(error);

      if (error && String(error).toLowerCase().includes("permission")) {
        baoLoiCamera(
          "Camera bị Từ Chối Quyền"
        );
      } else {
        baoLoiCamera(
          "Không Mở Được Camera"
        );
      }
    });
  }

  // Cho HTML load xong roi moi khoi dong scanner.
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", khoiDongCamera, {
      once: true
    });
  } else {
    khoiDongCamera();
  }
})();
</script>
</body>
</html>
