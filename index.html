<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Quét QR Tờ Lệnh @BinhPo21</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
.wrap{width:min(560px,100%);margin:0 auto;padding:12px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 3px 14px rgba(0,0,0,.08)}
h1{margin:0 0 5px;font-size:22px;text-align:center}
.sub{margin:0 0 12px;text-align:center;color:#6b7280;font-size:13px}
.camera{width:100%;height:440px;position:relative;overflow:hidden;border-radius:12px;background:#111}
#video{width:100%;height:100%;display:block;object-fit:cover;background:#111}
.scan-box{position:absolute;left:50%;top:50%;width:min(72vw,330px);height:min(72vw,330px);transform:translate(-50%,-50%);border:4px solid rgba(255,255,255,.95);border-radius:4px;pointer-events:none}
.scan-box:before,.scan-box:after{content:"";position:absolute;width:70px;height:70px;border-color:#fff;border-style:solid}
.scan-box:before{left:-4px;top:-4px;border-width:7px 0 0 7px}
.scan-box:after{right:-4px;bottom:-4px;border-width:0 7px 7px 0}
.status{margin-top:8px;padding:9px;border-radius:9px;background:#f3f4f6;font-size:13px;text-align:center;word-break:break-word}
.status.ok{background:#ecfdf5;color:#065f46}
.status.error{background:#fef2f2;color:#991b1b}

#formContainer{display:none;margin-top:12px;padding-bottom:78px}
#googleForm{width:100%;height:900px;display:block;border:none;border-radius:12px;background:#fff}

/* Nut quet lai co dinh theo man hinh, luon nhin thay khi cuon Form */
#btnScanAgain{
position:fixed;
left:50%;
bottom:14px;
transform:translateX(-50%);
width:min(520px,calc(100vw - 28px));
min-height:54px;
z-index:99999;
border:0;
border-radius:12px;
background:#16a34a;
color:#fff;
font-size:17px;
font-weight:700;
box-shadow:0 4px 18px rgba(0,0,0,.28);
-webkit-tap-highlight-color:transparent;
}
#btnScanAgain:active{transform:translateX(-50%) scale(.98)}

.manual{margin-top:10px;border-top:1px solid #e5e7eb;padding-top:10px}
label{display:block;margin-bottom:6px;font-weight:600;font-size:13px}
input{width:100%;min-height:46px;padding:10px;border:1px solid #d1d5db;border-radius:9px;font-size:16px;outline:none}
#openButton{width:100%;min-height:46px;margin-top:8px;border:0;border-radius:9px;background:#4f46e5;color:#fff;font-size:15px;font-weight:600}
.info{margin-top:10px;font-size:11px;color:#6b7280;line-height:1.4;text-align:center}
</style>
</head>
<body>
<main class="wrap"><section class="card">
<h1>📷 Quét QR Tờ Lệnh @BinhPo21</h1>
<p class="sub">Quét QR → tự điền Google Form</p>

<div class="camera" id="cameraBox">
<video id="video" playsinline muted></video>
<div class="scan-box"></div>
</div>

<div id="status" class="status">Đang tải bộ quét QR...</div>

<div id="formContainer">
<iframe id="googleForm" title="Google Form"></iframe>
<button id="btnScanAgain" type="button">🔄 QUÉT TỜ LỆNH TIẾP</button>
</div>

<div class="manual" id="manualBox">
<label for="manualCode">Nhập mã QR nếu cần</label>
<input id="manualCode" type="text" autocomplete="off" placeholder="Dán chuỗi QR vào đây">
<button id="openButton" type="button">Mở Google Form</button>
</div>

<div class="info">QR gồm 6 giá trị, ngăn cách bằng dấu |.</div>
</section></main>

<script type="module">
import { BrowserQRCodeReader } from "https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/+esm";

const FORM_URL="https://docs.google.com/forms/d/e/1FAIpQLSdGFniU6DwdOeNJ5rbvE7cbEVwHiCKQe8skzRx-4ktXtK5hQQ/viewform";
const ENTRY_IDS=[
"entry.392564381","entry.682796725","entry.260788272",
"entry.632173225","entry.2147420635","entry.697190504"
];

const video=document.getElementById("video");
const cameraBox=document.getElementById("cameraBox");
const statusBox=document.getElementById("status");
const formContainer=document.getElementById("formContainer");
const googleForm=document.getElementById("googleForm");
const btnScanAgain=document.getElementById("btnScanAgain");
const manualBox=document.getElementById("manualBox");
const manualInput=document.getElementById("manualCode");
const openButton=document.getElementById("openButton");

let reader=null,controls=null,daQuet=false;

function taoLinkForm(chuoiQR){
 const parts=String(chuoiQR??"").trim().split("|");
 if(parts.length!==ENTRY_IDS.length)
   throw new Error("QR khong dung cau truc: can 6 gia tri, hien co "+parts.length+" gia tri.");
 const params=new URLSearchParams();
 params.set("usp","pp_url");
 for(let i=0;i<ENTRY_IDS.length;i++) params.set(ENTRY_IDS[i],parts[i].trim());
 return FORM_URL+"?"+params.toString();
}

async function dungCamera(){
 if(controls){try{controls.stop()}catch(_){} controls=null;}
 if(reader){try{reader.reset()}catch(_){}}
}

async function moGoogleForm(chuoiQR){
 try{
  const url=taoLinkForm(chuoiQR);
  daQuet=true;
  await dungCamera();
  cameraBox.style.display="none";
  manualBox.style.display="none";
  statusBox.textContent="✅ Đã quét. Điền thông tin rồi bấm Gửi.";
  statusBox.className="status ok";
  googleForm.src=url+"&embedded=true";
  formContainer.style.display="block";
  formContainer.scrollIntoView({behavior:"smooth",block:"start"});
 }catch(error){
  statusBox.textContent=error.message;
  statusBox.className="status error";
  daQuet=false;
 }
}

function xuLyMaQuet(text){
 if(daQuet)return;
 const value=String(text||"").trim();
 if(value.split("|").length!==6)return;
 moGoogleForm(value);
}

openButton.addEventListener("click",()=>moGoogleForm(manualInput.value));
manualInput.addEventListener("keydown",e=>{
 if(e.key==="Enter"){e.preventDefault();moGoogleForm(manualInput.value);}
});

btnScanAgain.addEventListener("click",async()=>{
 googleForm.src="";
 formContainer.style.display="none";
 cameraBox.style.display="block";
 manualBox.style.display="block";
 daQuet=false;
 statusBox.textContent="📷 Đang mở camera...";
 statusBox.className="status";
 await khoiDong();
 window.scrollTo({top:0,behavior:"smooth"});
});

async function khoiDong(){
 try{
  if(!window.isSecureContext)throw new Error("Trang phai chay bang HTTPS.");
  statusBox.textContent="Đang xin quyền Camera...";
  reader=new BrowserQRCodeReader();
  controls=await reader.decodeFromConstraints({
   audio:false,
   video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}
  },video,(result,error)=>{
   if(result)xuLyMaQuet(result.getText());
  });
  statusBox.textContent="Sẵn sàng - đưa QR vào giữa khung.";
  statusBox.className="status";
 }catch(error){
  console.error(error);
  statusBox.textContent="Không khởi động được Camera: "+(error.message||error);
  statusBox.className="status error";
 }
}
khoiDong();
</script>
</body>
</html>
