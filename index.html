<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>Quét mã đơn hàng</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    .wrap {
      width: min(560px, 100%);
      margin: 0 auto;
      padding: 12px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 3px 14px rgba(0,0,0,.08);
    }
    h1 {
      margin: 0 0 5px;
      font-size: 22px;
      text-align: center;
    }
    .sub {
      margin: 0 0 12px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }
    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #111;
    }
    #reader video {
      border-radius: 12px;
    }
    .status {
      margin-top: 10px;
      padding: 9px;
      border-radius: 9px;
      background: #f3f4f6;
      font-size: 13px;
      text-align: center;
      word-break: break-word;
    }
    .status.ok {
      background: #ecfdf5;
      color: #065f46;
    }
    .status.error {
      background: #fef2f2;
      color: #991b1b;
    }
    .manual {
      margin-top: 12px;
      border-top: 1px solid #e5e7eb;
      padding-top: 12px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
    }
    input {
      width: 100%;
      min-height: 46px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }
    button {
      width: 100%;
      min-height: 46px;
      margin-top: 8px;
      border: 0;
      border-radius: 9px;
      background: #4f46e5;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
    }
    .info {
      margin-top: 10px;
      font-size: 11px;
      color: #6b7280;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">
      <h1>📷 Quét mã đơn hàng</h1>
      <p class="sub">Đưa Barcode vào giữa khung → tự mở Google Form</p>

      <div id="reader"></div>

      <div id="status" class="status">
        Đang khởi động camera...
      </div>

      <div class="manual">
        <label for="manualCode">Máy quét Bluetooth hoặc nhập thủ công</label>
        <input id="manualCode" type="text" autocomplete="off"
               placeholder="Quét mã vào đây nếu dùng máy quét">
        <button id="openButton" type="button">Mở Google Form</button>
      </div>

      <div class="info">
        Chỉ nhận CODE 128 để tăng tốc độ nhận diện.
      </div>
    </section>
  </main>

<script>
  // ============================================================
  // CẤU HÌNH GOOGLE FORM
  // ============================================================

  const FORM_URL =
    "https://docs.google.com/forms/d/e/1FAIpQLSfI5TyKALA7hhb6UwHx4-GvgxRbC1-mx32z7PcvEk1CWJTpRg/viewform";

  const ENTRY_ID = "entry.850710254";


  // ============================================================
  // XỬ LÝ MÃ
  // ============================================================

  const statusBox = document.getElementById("status");
  const manualInput = document.getElementById("manualCode");
  const openButton = document.getElementById("openButton");

  let daQuet = false;

  function moGoogleForm(maDonHang) {
    maDonHang = String(maDonHang ?? "").trim();

    if (!maDonHang) {
      statusBox.textContent = "Chưa có mã đơn hàng.";
      statusBox.className = "status error";
      return;
    }

    const url = FORM_URL + "?usp=pp_url&" +
                ENTRY_ID + "=" + encodeURIComponent(maDonHang);

    statusBox.textContent = "Đã quét: " + maDonHang;
    statusBox.className = "status ok";

    window.location.replace(url);
  }

  function xuLyMaQuet(ma) {
    if (daQuet) return;
    daQuet = true;

    if (window.scanner && window.scanner.isScanning) {
      window.scanner.stop().catch(() => {});
    }

    // Cho trình duyệt có thời gian xử lý frame cuối rồi chuyển trang.
    setTimeout(function () {
      moGoogleForm(ma);
    }, 60);
  }

  openButton.addEventListener("click", function () {
    moGoogleForm(manualInput.value);
  });

  manualInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      moGoogleForm(manualInput.value);
    }
  });


  // ============================================================
  // CAMERA + SCANNER TỐI ƯU
  // ============================================================

  if (!window.Html5Qrcode) {
    statusBox.textContent =
      "Không tải được thư viện quét Barcode.";
    statusBox.className = "status error";
  } else {
    // Chỉ CODE_128.
    // Không bắt QR/EAN/UPC/Code39... giúp giảm công việc nhận diện.
    const config = {
      fps: 15,

      // Barcode Code 128 dài và nằm ngang nên vùng quét ngang,
      // thấp hơn sẽ giảm số điểm ảnh cần xử lý.
      qrbox: function(viewfinderWidth, viewfinderHeight) {
        const width = Math.min(viewfinderWidth * 0.92, 520);
        const height = Math.min(Math.max(width * 0.30, 120), 170);
        return {
          width: Math.floor(width),
          height: Math.floor(height)
        };
      },

      aspectRatio: 16 / 9,

      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128
      ],

      // Nếu Chrome/Android hỗ trợ BarcodeDetector thì dùng bộ
      // nhận diện native, thường nhanh hơn decoder JavaScript.
      useBarCodeDetectorIfSupported: true,

      // Không cần đọc Barcode bị lật ngang vì đang dùng camera sau.
      disableFlip: true,

      // Yêu cầu camera sau, ưu tiên HD vừa phải để nhận diện nhanh.
      videoConstraints: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 30, max: 30 }
      }
    };

    window.scanner = new Html5Qrcode("reader", {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128
      ],
      useBarCodeDetectorIfSupported: true,
      verbose: false
    });

    scanner.start(
      { facingMode: "environment" },
      config,
      function(decodedText) {
        xuLyMaQuet(decodedText);
      },
      function() {
        // Không hiển thị lỗi của từng frame.
      }
    ).then(function() {
      statusBox.textContent =
        "Sẵn sàng — đưa CODE 128 vào khung.";
      statusBox.className = "status";
    }).catch(function(error) {
      statusBox.textContent =
        "Không mở được Camera. Hãy cấp quyền Camera cho trình duyệt.";
      statusBox.className = "status error";
      console.error(error);
    });
  }
</script>
</body>
</html>
