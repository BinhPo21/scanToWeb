<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>Quét mã sản phẩm</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    .wrap {
      width: min(560px, 100%);
      margin: 0 auto;
      padding: 12px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 3px 14px rgba(0,0,0,.08);
    }
    h1 {
      margin: 0 0 5px;
      font-size: 22px;
      text-align: center;
    }
    .sub {
      margin: 0 0 12px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }
    #reader {
      width: 100%;
      height: 220px;
      overflow: hidden;
      border-radius: 12px;
      background: #111;
      position: relative;
    }
    #reader video {
      width: 100% !important;
      height: 220px !important;
      max-height: 220px !important;
      object-fit: cover !important;
      border-radius: 12px;
    }
    #reader__scan_region {
      min-height: 0 !important;
      height: 220px !important;
    }
    #reader__scan_region img {
      display: none !important;
    }
    .status {
      margin-top: 8px;
      padding: 9px;
      border-radius: 9px;
      background: #f3f4f6;
      font-size: 13px;
      text-align: center;
      word-break: break-word;
    }
    .status.ok {
      background: #ecfdf5;
      color: #065f46;
    }
    .status.error {
      background: #fef2f2;
      color: #991b1b;
    }
    .manual {
      margin-top: 10px;
      border-top: 1px solid #e5e7eb;
      padding-top: 10px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
    }
    input {
      width: 100%;
      min-height: 46px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }
    button {
      width: 100%;
      min-height: 46px;
      margin-top: 8px;
      border: 0;
      border-radius: 9px;
      background: #4f46e5;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
    }
    .info {
      margin-top: 10px;
      font-size: 11px;
      color: #6b7280;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">
      <h1>📷 Quét mã sản phẩm</h1>
      <p class="sub">Quét QR → tự điền Google Form</p>

      <div id="reader"></div>

      <div id="status" class="status">
        Đang khởi động camera...
      </div>

      <div class="manual">
        <label for="manualCode">Nhập mã QR nếu cần</label>
        <input id="manualCode" type="text" autocomplete="off"
               placeholder="Dán chuỗi QR vào đây">
        <button id="openButton" type="button">Mở Google Form</button>
      </div>

      <div class="info">
        QR phải có đúng 6 giá trị, ngăn cách bằng dấu |.
      </div>
    </section>
  </main>

<script>
  // ============================================================
  // CẤU HÌNH GOOGLE FORM
  // ============================================================

  const FORM_URL =
    "https://docs.google.com/forms/d/e/1FAIpQLSdGFniU6DwdOeNJ5rbvE7cbEVwHiCKQe8skzRx-4ktXtK5hQQ/viewform";

  // Thứ tự dữ liệu trong QR:
  // 1. Khách Hàng       -> entry.392564381
  // 2. Đơn Hàng         -> entry.682796725
  // 3. Mã Lệnh          -> entry.260788272
  // 4. Quy Cách SX      -> entry.632173225
  // 5. Màu Sắc          -> entry.2147420635
  // 6. Số Lượng YC      -> entry.697190504

  const ENTRY_IDS = [
    "entry.392564381",
    "entry.682796725",
    "entry.260788272",
    "entry.632173225",
    "entry.2147420635",
    "entry.697190504"
  ];

  let daQuet = false;

  function taoLinkForm(chuoiQR) {
    const parts = String(chuoiQR ?? "").split("|");

    if (parts.length !== ENTRY_IDS.length) {
      throw new Error(
        "QR không đúng cấu trúc. Cần 6 giá trị, nhưng nhận được " +
        parts.length + " giá trị."
      );
    }

    const params = new URLSearchParams();
    params.set("usp", "pp_url");

    for (let i = 0; i < ENTRY_IDS.length; i++) {
      params.set(ENTRY_IDS[i], parts[i].trim());
    }

    return FORM_URL + "?" + params.toString();
  }

  function moGoogleForm(chuoiQR) {
    try {
      const url = taoLinkForm(chuoiQR);

      statusBox.textContent =
        "Đã quét đủ 6 thông tin — đang mở Form...";
      statusBox.className = "status ok";

      window.location.replace(url);
    } catch (error) {
      statusBox.textContent = error.message;
      statusBox.className = "status error";
      daQuet = false;
    }
  }

  function xuLyMaQuet(ma) {
    if (daQuet) return;
    daQuet = true;

    if (window.scanner && window.scanner.isScanning) {
      window.scanner.stop().catch(() => {});
    }

    setTimeout(function () {
      moGoogleForm(ma);
    }, 60);
  }

  openButton.addEventListener("click", function () {
    moGoogleForm(manualInput.value);
  });

  manualInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      moGoogleForm(manualInput.value);
    }
  });

  const statusBox = document.getElementById("status");
  const manualInput = document.getElementById("manualCode");

  // ============================================================
  // CAMERA - CHỈ QUÉT QR CODE
  // ============================================================

  if (!window.Html5Qrcode) {
    statusBox.textContent =
      "Không tải được thư viện quét QR.";
    statusBox.className = "status error";
  } else {
    window.scanner = new Html5Qrcode("reader", {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE
      ],
      useBarCodeDetectorIfSupported: true,
      verbose: false
    });

    const config = {
      fps: 15,

      qrbox: function(viewfinderWidth, viewfinderHeight) {
        const size = Math.min(viewfinderWidth * 0.70, 210);
        return {
          width: Math.floor(size),
          height: Math.floor(size)
        };
      },

      aspectRatio: 16 / 9,

      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE
      ],

      useBarCodeDetectorIfSupported: true,
      disableFlip: true,

      videoConstraints: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 30, max: 30 }
      }
    };

    scanner.start(
      { facingMode: "environment" },
      config,
      function(decodedText) {
        xuLyMaQuet(decodedText);
      },
      function() {
        // Bỏ qua lỗi của từng khung hình.
      }
    ).then(function() {
      statusBox.textContent =
        "Sẵn sàng — đưa QR vào giữa khung.";
      statusBox.className = "status";
    }).catch(function(error) {
      statusBox.textContent =
        "Không mở được Camera. Hãy cấp quyền Camera cho trình duyệt.";
      statusBox.className = "status error";
      console.error(error);
    });
  }
</script>
</body>
</html>
