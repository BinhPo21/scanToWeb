<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Test Google Visualization API</title>

<style>
body{
    font-family:Arial,sans-serif;
    padding:20px;
    max-width:900px;
    margin:auto;
}

input,button{
    padding:12px;
    font-size:16px;
    margin:5px 0;
}

input{
    width:min(500px,100%);
}

button{
    cursor:pointer;
}

#result{
    margin-top:20px;
    padding:15px;
    background:#f3f4f6;
    white-space:pre-wrap;
    word-break:break-word;
    border-radius:8px;
}

.ok{color:#065f46}
.error{color:#991b1b}
</style>
</head>

<body>

<h2>🔍 Test Google Visualization API</h2>

<input
    id="maLenh"
    value="T09.26.140.1.10"
    placeholder="Nhập Mã Lệnh"
>

<br>

<button onclick="test()">🚀 Test = và CONTAINS</button>

<div id="result">
Sẵn sàng...
</div>


<script>

const spreadsheetId =
    "1GPpPKs8Kj2l3bpw98W9Wux-hXZ69JoysDTvnm9vwVOQ";

const tenSheet =
    "Lệnh T09.26";


async function chayQuery(query){

    const url =
        "https://docs.google.com/spreadsheets/d/" +
        spreadsheetId +
        "/gviz/tq?" +

        new URLSearchParams({
            sheet: tenSheet,
            tq: query
        }).toString();


    const start = performance.now();

    const response =
        await fetch(url);

    const text =
        await response.text();

    const end = performance.now();

    return {
        url:url,
        query:query,
        status:response.status,
        time:(end-start).toFixed(0),
        text:text
    };
}


function laySoDong(text){

    try{

        const match =
            text.match(
                /google\.visualization\.Query\.setResponse\((.*)\);/s
            );

        if(!match)return "?";

        const json =
            JSON.parse(match[1]);

        return json.table.rows.length;

    }catch(error){

        return "?";

    }

}


async function test(){

    const result =
        document.getElementById("result");

    const maLenh =
        document.getElementById("maLenh")
        .value
        .trim();


    if(!maLenh){

        result.textContent =
            "❌ Vui lòng nhập Mã Lệnh.";

        return;

    }


    result.textContent =
        "⏳ Đang test...\n\n" +
        "Mã Lệnh: " + maLenh;


    const maEscape =
        maLenh.replace(/'/g,"''");


    // TEST 1: Tim chinh xac
    const queryExact =
        "select B,F,G,K,L,M,N where B = '" +
        maEscape +
        "'";


    // TEST 2: Tim gan dung
    const queryContains =
        "select B,F,G,K,L,M,N where B contains '" +
        maEscape +
        "'";


    try{

        const exact =
            await chayQuery(queryExact);


        const contains =
            await chayQuery(queryContains);


        const exactRows =
            laySoDong(exact.text);


        const containsRows =
            laySoDong(contains.text);


        let ketQua =

            "🔍 MÃ LỆNH: " +
            maLenh +

            "\n\n━━━━━━━━━━━━━━━━━━━━" +

            "\n1️⃣ TÌM CHÍNH XÁC (=)" +

            "\nQuery:\n" +
            exact.query +

            "\n\n⏱ Thời gian: " +
            exact.time + " ms" +

            "\nHTTP: " +
            exact.status +

            "\nSố dòng tìm thấy: " +
            exactRows;


        ketQua +=

            "\n\n━━━━━━━━━━━━━━━━━━━━" +

            "\n2️⃣ TÌM GẦN ĐÚNG (CONTAINS)" +

            "\nQuery:\n" +
            contains.query +

            "\n\n⏱ Thời gian: " +
            contains.time + " ms" +

            "\nHTTP: " +
            contains.status +

            "\nSố dòng tìm thấy: " +
            containsRows;


        ketQua +=

            "\n\n━━━━━━━━━━━━━━━━━━━━" +

            "\n📄 KẾT QUẢ RAW CỦA (=):\n\n" +
            exact.text +

            "\n\n━━━━━━━━━━━━━━━━━━━━" +

            "\n📄 KẾT QUẢ RAW CỦA (CONTAINS):\n\n" +
            contains.text;


        result.textContent =
            ketQua;


    }catch(error){

        result.textContent =
            "❌ Lỗi:\n" +
            error.message;

        console.error(error);

    }

}

</script>

</body>
</html>
